<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrégateur de Codes Promo YouTube</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        tablehover: '#273548'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- En-tête -->
    <header class="border-b border-slate-800 bg-darkbg/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🎟️</span>
                <h1 class="text-xl font-bold tracking-tight text-white">Promos YouTube</h1>
            </div>
            <!-- Barre de recherche -->
            <div class="w-full sm:w-80">
                <input type="text" id="searchInput" placeholder="Rechercher une marque, un code..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <p id="counter" class="text-sm text-slate-400">Chargement des codes promo...</p>
            <span id="updateDate" class="text-xs text-slate-500"></span>
        </div>

        <!-- Tableau des offres -->
        <div class="bg-cardbg border border-slate-800 rounded-xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase bg-slate-900/50">
                            <th onclick="sortTable('brand')" class="py-3.5 px-6 cursor-pointer hover:text-indigo-400 transition">Marque ↕</th>
                            <th onclick="sortTable('promo_code')" class="py-3.5 px-6 cursor-pointer hover:text-indigo-400 transition">Code Promo ↕</th>
                            <th onclick="sortTable('offer')" class="py-3.5 px-6 cursor-pointer hover:text-indigo-400 transition">Offre / Réduction ↕</th>
                            <th class="py-3.5 px-6 text-center">Lien Offre</th>
                            <th class="py-3.5 px-6 text-center">Vidéo Source</th>
                        </tr>
                    </thead>
                    <tbody id="promoTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Injecté dynamiquement par JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script de chargement, de tri et de recherche -->
    <script>
        let allOffers = [];
        let currentSort = { column: null, ascending: true };

        async function loadPromos() {
            try {
                const response = await fetch('./data/promos.json');
                if (!response.ok) throw new Error("Fichier introuvable");
                
                const data = await response.json();
                allOffers = data.offers || [];
                
                if (data.updated_at) {
                    const dateObj = new Date(data.updated_at);
                    document.getElementById('updateDate').innerText = `Dernière synchro : ${dateObj.toLocaleDateString('fr-FR')} à ${dateObj.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}`;
                }

                displayOffers(allOffers);
            } catch (error) {
                document.getElementById('promoTableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-12 text-slate-500">
                            <p class="text-lg">Aucun fichier de codes promo trouvé pour l'instant.</p>
                            <p class="text-sm mt-2">Lancez votre workflow n8n pour générer le premier <code>promos.json</code> !</p>
                        </td>
                    </tr>`;
                document.getElementById('counter').innerText = '0 offre disponible';
            }
        }

        function displayOffers(offers) {
            const tbody = document.getElementById('promoTableBody');
            document.getElementById('counter').innerText = `${offers.length} offre${offers.length > 1 ? 's' : ''} active${offers.length > 1 ? 's' : ''}`;

            if (offers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-500">Aucun résultat ne correspond à votre recherche.</td></tr>`;
                return;
            }

            tbody.innerHTML = offers.map(item => `
                <tr class="hover:bg-tablehover transition">
                    <!-- Marque -->
                    <td class="py-4 px-6 font-semibold text-white whitespace-nowrap">
                        ${escapeHtml(item.brand)}
                    </td>
                    
                    <!-- Code Promo avec bouton Copier -->
                    <td class="py-4 px-6 whitespace-nowrap">
                        <div class="inline-flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5">
                            <span class="font-mono font-bold text-indigo-400 tracking-wider select-all">${escapeHtml(item.promo_code)}</span>
                            <button onclick="copyCode('${escapeHtml(item.promo_code, true)}', this)" 
                                class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2.5 py-1 rounded transition font-medium">
                                Copier
                            </button>
                        </div>
                    </td>

                    <!-- Description de l'offre -->
                    <td class="py-4 px-6 text-slate-300 max-w-xs truncate" title="${escapeHtml(item.offer)}">
                        ${escapeHtml(item.offer)}
                    </td>

                    <!-- Lien de l'offre -->
                    <td class="py-4 px-6 text-center whitespace-nowrap">
                        ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 text-xs font-medium transition inline-flex items-center gap-1 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-md">Lien ↗</a>` : '<span class="text-slate-600">-</span>'}
                    </td>

                    <!-- Vidéo source -->
                    <td class="py-4 px-6 text-center whitespace-nowrap">
                        ${item.video_url ? `<a href="${item.video_url}" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-slate-200 text-xs font-medium transition inline-flex items-center gap-1 bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-md">🎥 Vidéo</a>` : '<span class="text-slate-600">-</span>'}
                    </td>
                </tr>
            `).join('');
        }

        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.ascending = !currentSort.ascending;
            } else {
                currentSort.column = column;
                currentSort.ascending = true;
            }

            const sorted = [...allOffers].sort((a, b) => {
                let valA = (a[column] || "").toLowerCase();
                let valB = (b[column] || "").toLowerCase();
                if (valA < valB) return currentSort.ascending ? -1 : 1;
                if (valA > valB) return currentSort.ascending ? 1 : -1;
                return 0;
            });

            displayOffers(sorted);
        }

        function copyCode(code, btn) {
            navigator.clipboard.writeText(code);
            const originalText = btn.innerText;
            btn.innerText = 'Copié !';
            btn.classList.add('bg-green-600', 'text-white');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('bg-green-600', 'text-white');
            }, 2000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Filtrage en temps réel
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allOffers.filter(item => 
                item.brand.toLowerCase().includes(query) || 
                item.promo_code.toLowerCase().includes(query) || 
                item.offer.toLowerCase().includes(query)
            );
            displayOffers(filtered);
        });

        loadPromos();
    </script>
</body>
</html>
