<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codes Promo YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --surface-hover: #1b212e;
      --border: #242b3b;
      --text: #f3f5f8;
      --muted: #8b97b0;
      --accent: #ff3b5c;
      --accent-soft: rgba(255, 59, 92, 0.16);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.14);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 28px 20px 64px; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand-title { display: flex; align-items: center; gap: 12px; }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #ff7a59);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }

    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.88rem; }
    .meta-badges { display: flex; flex-wrap: wrap; gap: 8px; }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .kpi-label { color: var(--muted); font-size: 0.8rem; font-weight: 500; }
    .kpi-value { font-size: 1.75rem; font-weight: 800; margin-top: 2px; letter-spacing: -0.03em; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 11px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: 0.15s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Filters + Bouton Reset bien visible */
    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }

    input[type="search"], select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      min-height: 42px;
    }

    input[type="search"]:focus, select:focus { border-color: var(--accent); }

    .reset-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0 15px;
      min-height: 42px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: not-allowed;
      opacity: 0.55;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .reset-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      opacity: 1;
      box-shadow: 0 4px 14px rgba(255, 59, 92, 0.2);
    }

    .reset-btn.active:hover {
      background: var(--accent);
    }

    .filter-summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .page-size-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .page-size-wrap select {
      width: auto;
      padding: 6px 10px;
      min-height: 34px;
      font-size: 0.82rem;
    }

    /* Table Desktop */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead th {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-hover); }

    td { padding: 14px 16px; vertical-align: middle; font-size: 0.9rem; }

    .brand-cell { display: flex; flex-direction: column; gap: 2px; }
    .brand-name { font-size: 1.05rem; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
    .brand-date { font-size: 0.74rem; color: var(--muted); }

    .discount-badge {
      display: inline-block;
      background: var(--green-soft);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-weight: 800;
      font-size: 0.92rem;
      padding: 4px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .discount-empty { color: var(--muted); font-size: 0.85rem; }

    .code-cell {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0d1017;
      border: 1px dashed #3a455e;
      border-radius: 8px;
      padding: 5px 6px 5px 11px;
    }

    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ff6b84;
      letter-spacing: 0.04em;
    }

    .copy-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 11px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn:hover { filter: brightness(1.1); }
    .copy-btn.copied { background: var(--green); }

    .offer-cell { color: #cbd5e1; font-size: 0.86rem; max-width: 300px; }

    .channel-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.84rem;
      text-decoration: none;
      transition: color 0.15s;
    }
    .channel-link:hover { color: #fff; }
    .channel-link:hover .avatar-sm { border-color: var(--accent); }

    .avatar-sm {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: #232a3a;
    }

    .avatar-sm-fallback {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #232a3a;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.68rem;
      flex-shrink: 0;
    }

    .links-cell { display: flex; gap: 10px; justify-content: flex-end; white-space: nowrap; }

    .link-btn {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(59, 130, 246, 0.08);
    }
    .link-btn:hover { border-color: #60a5fa; color: #fff; }

    .link-video { color: var(--muted); text-decoration: none; font-size: 0.82rem; font-weight: 500; padding: 6px 8px; }
    .link-video:hover { color: var(--text); text-decoration: underline; }

    /* Pagination */
    .pagination {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .page-info { color: var(--muted); font-size: 0.85rem; }

    .page-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .page-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      min-width: 36px;
      height: 36px;
      padding: 0 11px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .page-btn:hover:not(:disabled) { border-color: var(--accent); }
    .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-dots { color: var(--muted); padding: 0 4px; font-size: 0.85rem; }

    /* Stats & Chaînes */
    .stats-list { display: flex; flex-direction: column; gap: 10px; }

    .stat-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 18px;
      display: grid;
      grid-template-columns: 1.4fr 2fr auto;
      align-items: center;
      gap: 16px;
    }

    .stat-brand-name { font-weight: 700; font-size: 1rem; }
    .stat-sub { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

    .bar-track { background: #0d1017; height: 9px; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #ff7a59); border-radius: 999px; }

    .action-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn:hover { border-color: var(--accent); color: #fff; }

    .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }

    .channel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .channel-card-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
    }
    .channel-card-link:hover .stat-brand-name { color: var(--accent); }

    .avatar-lg { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: #232a3a; }
    .avatar-lg-fallback { width: 60px; height: 60px; border-radius: 50%; background: #232a3a; color: var(--text); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }

    /* ================= RESPONSIVE / MOBILE ================= */
    @media (max-width: 960px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }
      .filters input[type="search"] {
        grid-column: 1 / -1;
      }
      .reset-btn {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      .container { padding: 18px 14px 48px; }
      h1 { font-size: 1.25rem; }

      .kpi-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .kpi-card { padding: 12px; }
      .kpi-label { font-size: 0.72rem; }
      .kpi-value { font-size: 1.35rem; }

      .filters { grid-template-columns: 1fr; }

      /* Transformation du tableau en cartes mobiles lisibles */
      .table-wrap {
        background: transparent;
        border: none;
      }
      table, thead, tbody, th, td, tr { display: block; width: 100%; }
      thead { display: none; }

      tbody tr {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 15px;
        margin-bottom: 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 12px;
        align-items: center;
      }
      tbody tr:last-child { border-bottom: 1px solid var(--border); }

      td { padding: 0; border: none; }

      /* Ligne 1 : Fournisseur à gauche, Réduction à droite */
      td.col-brand { grid-column: 1 / 2; }
      td.col-discount { grid-column: 2 / 3; text-align: right; }

      /* Ligne 2 : Détails */
      td.col-offer {
        grid-column: 1 / -1;
        max-width: none;
        font-size: 0.88rem;
      }

      /* Ligne 3 : Code promo pleine largeur */
      td.col-code { grid-column: 1 / -1; }
      td.col-code .code-cell {
        display: flex;
        width: 100%;
        padding: 7px 8px 7px 12px;
      }
      td.col-code .copy-btn { padding: 7px 14px; font-size: 0.84rem; }

      /* Ligne 4 : Chaîne à gauche, Liens à droite */
      td.col-channel {
        grid-column: 1 / 2;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      td.col-links {
        grid-column: 2 / 3;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }

      .stat-row { grid-template-columns: 1fr; gap: 10px; }
      .channels-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .pagination { flex-direction: column; align-items: stretch; text-align: center; }
      .page-controls { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-title">
        <div class="logo-badge">%</div>
        <div>
          <h1>Codes Promo YouTube</h1>
          <div class="subtitle">Répertoire automatique des codes promo par fournisseur</div>
        </div>
      </div>
      <div class="meta-badges">
        <span class="pill" id="updated-at">Chargement...</span>
        <span class="pill" id="retention-badge">Rétention : -- jours</span>
      </div>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Codes actifs</div>
        <div class="kpi-value" id="kpi-offers">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Fournisseurs</div>
        <div class="kpi-value" id="kpi-brands">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Chaînes</div>
        <div class="kpi-value" id="kpi-channels">-</div>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="offers">Codes Promo</button>
      <button class="tab-btn" data-tab="brands">Stats Fournisseurs</button>
      <button class="tab-btn" data-tab="channels">Chaînes YouTube</button>
    </nav>

    <!-- ONGLET 1 : TABLEAU + PAGINATION -->
    <section id="tab-offers" class="tab-panel active">
      <div class="filters">
        <input type="search" id="search-input" placeholder="Rechercher un fournisseur, un code, un détail..." />
        <select id="brand-filter"><option value="">Tous les fournisseurs</option></select>
        <select id="channel-filter"><option value="">Toutes les chaînes</option></select>
        <select id="sort-filter">
          <option value="discount">Meilleure réduction</option>
          <option value="recent">Vidéos plus récentes</option>
          <option value="brand">Fournisseur (A-Z)</option>
        </select>
        <button id="reset-filters" class="reset-btn" type="button">✕ Réinitialiser les filtres</button>
      </div>

      <div class="filter-summary">
        <span id="results-count">0 code affiché</span>
        <div class="page-size-wrap">
          <label for="page-size">Afficher :</label>
          <select id="page-size">
            <option value="15" selected>15 par page</option>
            <option value="30">30 par page</option>
            <option value="50">50 par page</option>
            <option value="9999">Tout</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fournisseur</th>
              <th>Réduction</th>
              <th>Code Promo</th>
              <th>Détails</th>
              <th>Chaîne</th>
              <th style="text-align: right;">Liens</th>
            </tr>
          </thead>
          <tbody id="offers-tbody"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination-bar">
        <div class="page-info" id="page-info"></div>
        <div class="page-controls" id="page-controls"></div>
      </div>
    </section>

    <!-- ONGLET 2 : STATS FOURNISSEURS -->
    <section id="tab-brands" class="tab-panel">
      <div id="brands-container" class="stats-list"></div>
    </section>

    <!-- ONGLET 3 : CHAÎNES YOUTUBE -->
    <section id="tab-channels" class="tab-panel">
      <div id="channels-container" class="channels-grid"></div>
    </section>
  </div>

  <script>
    let validOffers = [];
    let brandStats = [];
    let channelStats = [];
    let currentPage = 1;

    const escapeHtml = (str) =>
      String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    const normalizeUrl = (url) => {
      if (!url) return null;
      const trimmed = String(url).trim();
      if (!trimmed) return null;
      return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    };

    const getChannelUrl = (channel) => {
      if (channel?.handle) {
        const h = channel.handle.startsWith('@') ? channel.handle : `@${channel.handle}`;
        return `https://www.youtube.com/${h}`;
      }
      if (channel?.id && channel.id !== 'unknown') {
        return `https://www.youtube.com/channel/${channel.id}`;
      }
      return null;
    };

    const parseDiscount = (o) => {
      let val = typeof o.discount_value === 'number' ? o.discount_value : Number(o.discount_value);
      let unit = o.discount_unit || null;
      const text = o.offer || '';

      if (!val || isNaN(val)) {
        const pct = text.match(/(\d+(?:[.,]\d+)?)\s*%/);
        const eur = text.match(/(\d+(?:[.,]\d+)?)\s*€/);
        const mois = text.match(/(\d+)\s*mois/i);
        if (pct) { val = parseFloat(pct[1].replace(',', '.')); unit = '%'; }
        else if (eur) { val = parseFloat(eur[1].replace(',', '.')); unit = '€'; }
        else if (mois) { val = parseInt(mois[1], 10); unit = 'mois'; }
        else { val = 0; unit = null; }
      }

      let label = o.discount_label || null;
      if (!label && val) {
        if (unit === '%') label = `-${val}%`;
        else if (unit === '€') label = `-${val}€`;
        else if (unit === 'mois') label = `${val} mois`;
      }

      const rank = unit === '%' ? 3 : unit === '€' ? 2 : unit === 'mois' ? 1 : 0;
      return { val, unit, label, rank };
    };

    const formatPublishedDate = (iso) => {
      if (!iso) return '';
      const date = new Date(iso);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
    };

    const renderAvatar = (channel, size = 'sm') => {
      const name = channel?.name || '?';
      const initials = name.slice(0, 2).toUpperCase();
      const cls = size === 'lg' ? 'avatar-lg' : 'avatar-sm';
      const fb = size === 'lg' ? 'avatar-lg-fallback' : 'avatar-sm-fallback';
      if (channel?.avatar) {
        return `<img class="${cls}" src="${escapeHtml(channel.avatar)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.outerHTML='<div class=\\'${fb}\\'>${escapeHtml(initials)}</div>'" />`;
      }
      return `<div class="${fb}">${escapeHtml(initials)}</div>`;
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabName));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.toggle('active', panel.id === `tab-${tabName}`));
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    window.copyCode = async (btn, code) => {
      try {
        await navigator.clipboard.writeText(code);
        const orig = btn.textContent;
        btn.textContent = 'Copié !';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
      } catch {
        alert(`Code promo : ${code}`);
      }
    };

    window.filterByBrand = (brand) => {
      document.getElementById('brand-filter').value = brand.toLowerCase();
      document.getElementById('channel-filter').value = '';
      document.getElementById('search-input').value = '';
      document.getElementById('sort-filter').value = 'discount';
      currentPage = 1;
      switchTab('offers');
      renderOffers();
    };

    window.filterByChannel = (channelId) => {
      document.getElementById('channel-filter').value = channelId;
      document.getElementById('brand-filter').value = '';
      document.getElementById('search-input').value = '';
      currentPage = 1;
      switchTab('offers');
      renderOffers();
    };

    window.goToPage = (page) => {
      currentPage = page;
      renderOffers();
      document.getElementById('tab-offers').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    function renderPagination(totalItems, pageSize) {
      const bar = document.getElementById('pagination-bar');
      const info = document.getElementById('page-info');
      const controls = document.getElementById('page-controls');

      if (totalItems === 0) {
        bar.style.display = 'none';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * pageSize + 1;
      const end = Math.min(currentPage * pageSize, totalItems);

      bar.style.display = 'flex';
      info.textContent = `Affichage ${start}–${end} sur ${totalItems}`;

      if (totalPages <= 1) {
        controls.innerHTML = '';
        return;
      }

      // Génération compacte des numéros de pages (ex: 1 ... 4 5 6 ... 12)
      const pages = [];
      for (let p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) {
          pages.push(p);
        } else if (pages[pages.length - 1] !== '...') {
          pages.push('...');
        }
      }

      let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">← Préc.</button>`;
      for (const p of pages) {
        if (p === '...') {
          html += `<span class="page-dots">…</span>`;
        } else {
          html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
        }
      }
      html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Suiv. →</button>`;

      controls.innerHTML = html;
    }

    function renderOffers() {
      const tbody = document.getElementById('offers-tbody');
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const brandFilter = document.getElementById('brand-filter').value;
      const channelFilter = document.getElementById('channel-filter').value;
      const sortBy = document.getElementById('sort-filter').value;
      const pageSize = parseInt(document.getElementById('page-size').value, 10) || 15;

      let list = [...validOffers];

      if (query) {
        list = list.filter(o =>
          (o.brand || '').toLowerCase().includes(query) ||
          (o.promo_code || '').toLowerCase().includes(query) ||
          (o.offer || '').toLowerCase().includes(query) ||
          (o._disc.label || '').toLowerCase().includes(query) ||
          (o.channel?.name || '').toLowerCase().includes(query)
        );
      }
      if (brandFilter) list = list.filter(o => (o.brand || '').toLowerCase() === brandFilter);
      if (channelFilter) list = list.filter(o => (o.channel?.id || 'unknown') === channelFilter);

      if (sortBy === 'discount') {
        list.sort((a, b) =>
          (b._disc.rank - a._disc.rank) ||
          (b._disc.val - a._disc.val) ||
          (a.brand || '').localeCompare(b.brand || '', 'fr')
        );
      } else if (sortBy === 'recent') {
        list.sort((a, b) =>
          new Date(b.video_published_at || b.last_seen_at || 0) -
          new Date(a.video_published_at || a.last_seen_at || 0)
        );
      } else {
        list.sort((a, b) => (a.brand || '').localeCompare(b.brand || '', 'fr') || (b._disc.val - a._disc.val));
      }

      const hasFilter = Boolean(query || brandFilter || channelFilter);
      const resetBtn = document.getElementById('reset-filters');
      resetBtn.classList.toggle('active', hasFilter);
      resetBtn.disabled = !hasFilter;

      document.getElementById('results-count').textContent = `${list.length} code${list.length > 1 ? 's' : ''} trouvé${list.length > 1 ? 's' : ''}`;

      const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;

      renderPagination(list.length, pageSize);

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Aucun code promo ne correspond à vos critères.</td></tr>`;
        return;
      }

      const paginatedList = list.slice((currentPage - 1) * pageSize, currentPage * pageSize);

      tbody.innerHTML = paginatedList.map(o => {
        const offerLink = normalizeUrl(o.link);
        const videoLink = normalizeUrl(o.video_url);
        const channelUrl = getChannelUrl(o.channel);
        const pubDate = formatPublishedDate(o.video_published_at || o.last_seen_at);

        const channelHtml = channelUrl
          ? `<a class="channel-link" href="${escapeHtml(channelUrl)}" target="_blank" rel="noopener" title="Ouvrir la chaîne YouTube">
               ${renderAvatar(o.channel, 'sm')}
               <span>${escapeHtml(o.channel?.name || 'Chaîne')}</span>
             </a>`
          : `<div class="channel-link">
               ${renderAvatar(o.channel, 'sm')}
               <span>${escapeHtml(o.channel?.name || 'Chaîne inconnue')}</span>
             </div>`;

        return `
          <tr>
            <td class="col-brand">
              <div class="brand-cell">
                <span class="brand-name">${escapeHtml(o.brand)}</span>
                ${pubDate ? `<span class="brand-date">Vidéo du ${pubDate}</span>` : ''}
              </div>
            </td>
            <td class="col-discount">
              ${
                o._disc.label
                  ? `<span class="discount-badge">${escapeHtml(o._disc.label)}</span>`
                  : `<span class="discount-empty">-</span>`
              }
            </td>
            <td class="col-code">
              <div class="code-cell">
                <span class="code-text">${escapeHtml(o.promo_code)}</span>
                <button class="copy-btn" onclick="copyCode(this, '${escapeHtml(o.promo_code)}')">Copier</button>
              </div>
            </td>
            <td class="col-offer offer-cell">${escapeHtml(o.offer || '-')}</td>
            <td class="col-channel">${channelHtml}</td>
            <td class="col-links">
              <div class="links-cell">
                ${videoLink ? `<a class="link-video" href="${escapeHtml(videoLink)}" target="_blank" rel="noopener">Vidéo</a>` : ''}
                ${offerLink ? `<a class="link-btn" href="${escapeHtml(offerLink)}" target="_blank" rel="noopener">Offre →</a>` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderBrandsStats() {
      const container = document.getElementById('brands-container');
      if (brandStats.length === 0) {
        container.innerHTML = `<div class="empty-state">Aucune statistique fournisseur disponible.</div>`;
        return;
      }
      const maxCodes = Math.max(...brandStats.map(b => b.active_codes), 1);

      container.innerHTML = brandStats.map(b => {
        const pct = Math.round((b.active_codes / maxCodes) * 100);
        const best = b.best_label ? ` • Meilleure offre : ${b.best_label}` : '';
        return `
          <div class="stat-row">
            <div>
              <div class="stat-brand-name">${escapeHtml(b.brand)}</div>
              <div class="stat-sub">${b.active_codes} code${b.active_codes > 1 ? 's' : ''} actif${b.active_codes > 1 ? 's' : ''}${escapeHtml(best)}</div>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width: ${pct}%"></div></div>
            <button class="action-btn" onclick="filterByBrand('${escapeHtml(b.brand)}')">Voir les codes</button>
          </div>
        `;
      }).join('');
    }

    function renderChannelsStats() {
      const container = document.getElementById('channels-container');
      if (channelStats.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">Aucune chaîne disponible.</div>`;
        return;
      }

      container.innerHTML = channelStats.map(c => {
        const url = getChannelUrl(c);
        const inner = `
          ${renderAvatar(c, 'lg')}
          <div>
            <div class="stat-brand-name">${escapeHtml(c.name)}</div>
            <div class="stat-sub">${escapeHtml(c.handle || '')}</div>
          </div>
        `;
        return `
          <div class="channel-card">
            ${url ? `<a class="channel-card-link" href="${escapeHtml(url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="channel-card-link">${inner}</div>`}
            <span class="pill">${c.active_codes} code${c.active_codes > 1 ? 's' : ''}</span>
            <button class="action-btn" onclick="filterByChannel('${escapeHtml(c.id)}')">Voir ses codes</button>
          </div>
        `;
      }).join('');
    }

    function populateSelects() {
      const brandSelect = document.getElementById('brand-filter');
      const channelSelect = document.getElementById('channel-filter');

      [...brandStats].sort((a, b) => a.brand.localeCompare(b.brand, 'fr')).forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.brand.toLowerCase();
        opt.textContent = `${b.brand} (${b.active_codes})`;
        brandSelect.appendChild(opt);
      });

      [...channelStats].sort((a, b) => a.name.localeCompare(b.name, 'fr')).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.active_codes})`;
        channelSelect.appendChild(opt);
      });
    }

    async function init() {
      try {
        const res = await fetch(`./data/promos.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        validOffers = (data.offers || [])
          .filter(o => o.promo_code && String(o.promo_code).trim() !== '')
          .map(o => ({ ...o, _disc: parseDiscount(o) }));

        const bMap = {};
        const cMap = {};
        for (const o of validOffers) {
          const bKey = (o.brand || '').toLowerCase();
          if (!bMap[bKey]) {
            bMap[bKey] = { brand: o.brand, active_codes: 0, best_rank: -1, best_val: -1, best_label: null };
          }
          bMap[bKey].active_codes += 1;
          if (o._disc.rank > bMap[bKey].best_rank || (o._disc.rank === bMap[bKey].best_rank && o._disc.val > bMap[bKey].best_val)) {
            bMap[bKey].best_rank = o._disc.rank;
            bMap[bKey].best_val = o._disc.val;
            bMap[bKey].best_label = o._disc.label;
          }

          const cKey = o.channel?.id || 'unknown';
          if (!cMap[cKey]) {
            cMap[cKey] = {
              id: cKey,
              name: o.channel?.name || 'Chaîne inconnue',
              handle: o.channel?.handle || '',
              avatar: o.channel?.avatar || null,
              active_codes: 0
            };
          }
          cMap[cKey].active_codes += 1;
        }

        brandStats = Object.values(bMap).sort((a, b) => b.active_codes - a.active_codes);
        channelStats = Object.values(cMap).sort((a, b) => b.active_codes - a.active_codes);

        const updated = data.updated_at ? new Date(data.updated_at).toLocaleString('fr-FR') : '-';
        document.getElementById('updated-at').textContent = `Mis à jour : ${updated}`;
        document.getElementById('retention-badge').textContent = `Rétention : ${data.retention_days || 30} jours`;
        document.getElementById('kpi-offers').textContent = validOffers.length;
        document.getElementById('kpi-brands').textContent = brandStats.length;
        document.getElementById('kpi-channels').textContent = channelStats.length;

        populateSelects();
        renderOffers();
        renderBrandsStats();
        renderChannelsStats();
      } catch (err) {
        document.getElementById('offers-tbody').innerHTML = `
          <tr><td colspan="6" class="empty-state">Impossible de charger <code>data/promos.json</code> (${escapeHtml(err.message)}).</td></tr>`;
      }
    }

    ['search-input', 'brand-filter', 'channel-filter', 'sort-filter', 'page-size'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        currentPage = 1;
        renderOffers();
      });
    });

    document.getElementById('reset-filters').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('brand-filter').value = '';
      document.getElementById('channel-filter').value = '';
      document.getElementById('sort-filter').value = 'discount';
      currentPage = 1;
      renderOffers();
    });

    init();
  </script>
</body>
</html>
