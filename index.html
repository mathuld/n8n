<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codes Promo YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #141821;
      --surface-hover: #1b212e;
      --border: #242b3b;
      --text: #f3f5f8;
      --muted: #8b97b0;
      --accent: #ff3b5c;
      --accent-soft: rgba(255, 59, 92, 0.14);
      --green: #22c55e;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }

    /* Header */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #ff7a59);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }

    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 0.88rem; }

    .meta-badges { display: flex; flex-wrap: wrap; gap: 8px; }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* KPIs */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .kpi-label { color: var(--muted); font-size: 0.8rem; font-weight: 500; }
    .kpi-value { font-size: 1.75rem; font-weight: 800; margin-top: 2px; letter-spacing: -0.03em; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 11px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: 0.15s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Filters */
    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 860px) { .filters { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .filters { grid-template-columns: 1fr; } }

    input[type="search"], select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    input[type="search"]:focus, select:focus { border-color: var(--accent); }

    .filter-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      display: none;
    }
    .reset-btn.visible { display: inline-block; }

    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 760px;
    }

    thead th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-hover); }

    td {
      padding: 14px 16px;
      vertical-align: middle;
      font-size: 0.9rem;
    }

    /* Fournisseur mis en avant */
    .brand-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .brand-date {
      font-size: 0.74rem;
      color: var(--muted);
    }

    /* Code promo */
    .code-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0d1017;
      border: 1px dashed #3a455e;
      border-radius: 8px;
      padding: 5px 6px 5px 11px;
    }

    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92rem;
      font-weight: 700;
      color: #ff6b84;
      letter-spacing: 0.04em;
    }

    .copy-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .copy-btn:hover { filter: brightness(1.1); }
    .copy-btn.copied { background: var(--green); }

    .offer-cell {
      color: #d4dce8;
      max-width: 340px;
    }

    /* Chaîne YouTube plus discrète */
    .channel-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .avatar-sm {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: #232a3a;
    }

    .avatar-sm-fallback {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #232a3a;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.68rem;
      flex-shrink: 0;
    }

    .links-cell {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      white-space: nowrap;
    }

    .link-btn {
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(59, 130, 246, 0.08);
    }
    .link-btn:hover { border-color: #60a5fa; color: #fff; }

    .link-video {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 5px 8px;
    }
    .link-video:hover { color: var(--text); text-decoration: underline; }

    /* Stats Fournisseurs & Chaînes */
    .stats-list { display: flex; flex-direction: column; gap: 10px; }

    .stat-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 18px;
      display: grid;
      grid-template-columns: 1.4fr 2fr auto;
      align-items: center;
      gap: 16px;
    }

    @media (max-width: 700px) { .stat-row { grid-template-columns: 1fr; gap: 10px; } }

    .stat-brand-name { font-weight: 700; font-size: 1rem; }
    .stat-sub { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

    .bar-track {
      background: #0d1017;
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ff7a59);
      border-radius: 999px;
    }

    .action-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn:hover { border-color: var(--accent); color: #fff; }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .channel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .avatar-lg {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #232a3a;
    }

    .avatar-lg-fallback {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #232a3a;
      color: var(--text);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-title">
        <div class="logo-badge">%</div>
        <div>
          <h1>Codes Promo YouTube</h1>
          <div class="subtitle">Répertoire automatique des codes promo par fournisseur</div>
        </div>
      </div>
      <div class="meta-badges">
        <span class="pill" id="updated-at">Chargement...</span>
        <span class="pill" id="retention-badge">Rétention : -- jours</span>
      </div>
    </header>

    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Codes promo actifs</div>
        <div class="kpi-value" id="kpi-offers">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Fournisseurs</div>
        <div class="kpi-value" id="kpi-brands">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Chaînes YouTube</div>
        <div class="kpi-value" id="kpi-channels">-</div>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="offers">Codes Promo</button>
      <button class="tab-btn" data-tab="brands">Stats Fournisseurs</button>
      <button class="tab-btn" data-tab="channels">Chaînes YouTube</button>
    </nav>

    <!-- ONGLET 1 : TABLEAU DES CODES -->
    <section id="tab-offers" class="tab-panel active">
      <div class="filters">
        <input type="search" id="search-input" placeholder="Rechercher un fournisseur, un code, une réduction..." />
        <select id="brand-filter"><option value="">Tous les fournisseurs</option></select>
        <select id="channel-filter"><option value="">Toutes les chaînes</option></select>
        <select id="sort-filter">
          <option value="brand">Fournisseur (A-Z)</option>
          <option value="recent">Plus récents</option>
        </select>
      </div>

      <div class="filter-summary">
        <span id="results-count">0 code affiché</span>
        <button id="reset-filters" class="reset-btn">Réinitialiser</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fournisseur</th>
              <th>Code Promo</th>
              <th>Offre</th>
              <th>Chaîne</th>
              <th style="text-align: right;">Liens</th>
            </tr>
          </thead>
          <tbody id="offers-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ONGLET 2 : STATS FOURNISSEURS -->
    <section id="tab-brands" class="tab-panel">
      <div id="brands-container" class="stats-list"></div>
    </section>

    <!-- ONGLET 3 : CHAÎNES YOUTUBE -->
    <section id="tab-channels" class="tab-panel">
      <div id="channels-container" class="channels-grid"></div>
    </section>
  </div>

  <script>
    let validOffers = [];
    let brandStats = [];
    let channelStats = [];

    const escapeHtml = (str) =>
      String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    const normalizeUrl = (url) => {
      if (!url) return null;
      const trimmed = String(url).trim();
      if (!trimmed) return null;
      return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    };

    const formatRelativeDate = (iso) => {
      if (!iso) return '';
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / (1000 * 60 * 60 * 24));
      if (days <= 0) return "Aujourd'hui";
      if (days === 1) return 'Hier';
      return `Il y a ${days} j`;
    };

    const renderAvatar = (channel, size = 'sm') => {
      const name = channel?.name || '?';
      const initials = name.slice(0, 2).toUpperCase();
      const cls = size === 'lg' ? 'avatar-lg' : 'avatar-sm';
      const fb = size === 'lg' ? 'avatar-lg-fallback' : 'avatar-sm-fallback';
      if (channel?.avatar) {
        return `<img class="${cls}" src="${escapeHtml(channel.avatar)}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.outerHTML='<div class=\\'${fb}\\'>${escapeHtml(initials)}</div>'" />`;
      }
      return `<div class="${fb}">${escapeHtml(initials)}</div>`;
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabName));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.toggle('active', panel.id === `tab-${tabName}`));
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    window.copyCode = async (btn, code) => {
      try {
        await navigator.clipboard.writeText(code);
        const orig = btn.textContent;
        btn.textContent = 'Copié !';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
      } catch {
        alert(`Code promo : ${code}`);
      }
    };

    window.filterByBrand = (brand) => {
      document.getElementById('brand-filter').value = brand.toLowerCase();
      document.getElementById('channel-filter').value = '';
      document.getElementById('search-input').value = '';
      switchTab('offers');
      renderOffers();
    };

    window.filterByChannel = (channelId) => {
      document.getElementById('channel-filter').value = channelId;
      document.getElementById('brand-filter').value = '';
      document.getElementById('search-input').value = '';
      switchTab('offers');
      renderOffers();
    };

    function renderOffers() {
      const tbody = document.getElementById('offers-tbody');
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const brandFilter = document.getElementById('brand-filter').value;
      const channelFilter = document.getElementById('channel-filter').value;
      const sortBy = document.getElementById('sort-filter').value;

      let list = [...validOffers];

      if (query) {
        list = list.filter(o =>
          (o.brand || '').toLowerCase().includes(query) ||
          (o.promo_code || '').toLowerCase().includes(query) ||
          (o.offer || '').toLowerCase().includes(query) ||
          (o.channel?.name || '').toLowerCase().includes(query)
        );
      }
      if (brandFilter) list = list.filter(o => (o.brand || '').toLowerCase() === brandFilter);
      if (channelFilter) list = list.filter(o => (o.channel?.id || 'unknown') === channelFilter);

      if (sortBy === 'recent') {
        list.sort((a, b) => new Date(b.last_seen_at) - new Date(a.last_seen_at));
      } else {
        list.sort((a, b) => (a.brand || '').localeCompare(b.brand || '', 'fr'));
      }

      document.getElementById('reset-filters').classList.toggle('visible', Boolean(query || brandFilter || channelFilter));
      document.getElementById('results-count').textContent = `${list.length} code${list.length > 1 ? 's' : ''} affiché${list.length > 1 ? 's' : ''}`;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Aucun code promo ne correspond à vos critères.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(o => {
        const offerLink = normalizeUrl(o.link);
        const videoLink = normalizeUrl(o.video_url);
        const relDate = formatRelativeDate(o.last_seen_at);

        return `
          <tr>
            <td>
              <div class="brand-cell">
                <span class="brand-name">${escapeHtml(o.brand)}</span>
                ${relDate ? `<span class="brand-date">${relDate}</span>` : ''}
              </div>
            </td>
            <td>
              <div class="code-cell">
                <span class="code-text">${escapeHtml(o.promo_code)}</span>
                <button class="copy-btn" onclick="copyCode(this, '${escapeHtml(o.promo_code)}')">Copier</button>
              </div>
            </td>
            <td class="offer-cell">${escapeHtml(o.offer || '-')}</td>
            <td>
              <div class="channel-inline">
                ${renderAvatar(o.channel, 'sm')}
                <span>${escapeHtml(o.channel?.name || 'Chaîne inconnue')}</span>
              </div>
            </td>
            <td>
              <div class="links-cell">
                ${videoLink ? `<a class="link-video" href="${escapeHtml(videoLink)}" target="_blank" rel="noopener">Vidéo</a>` : ''}
                ${offerLink ? `<a class="link-btn" href="${escapeHtml(offerLink)}" target="_blank" rel="noopener">Offre →</a>` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderBrandsStats() {
      const container = document.getElementById('brands-container');
      if (brandStats.length === 0) {
        container.innerHTML = `<div class="empty-state">Aucune statistique fournisseur disponible.</div>`;
        return;
      }
      const maxCodes = Math.max(...brandStats.map(b => b.active_codes), 1);

      container.innerHTML = brandStats.map(b => {
        const pct = Math.round((b.active_codes / maxCodes) * 100);
        return `
          <div class="stat-row">
            <div>
              <div class="stat-brand-name">${escapeHtml(b.brand)}</div>
              <div class="stat-sub">${b.active_codes} code${b.active_codes > 1 ? 's' : ''} actif${b.active_codes > 1 ? 's' : ''}</div>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width: ${pct}%"></div></div>
            <button class="action-btn" onclick="filterByBrand('${escapeHtml(b.brand)}')">Voir les codes</button>
          </div>
        `;
      }).join('');
    }

    function renderChannelsStats() {
      const container = document.getElementById('channels-container');
      if (channelStats.length === 0) {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">Aucune chaîne disponible.</div>`;
        return;
      }

      container.innerHTML = channelStats.map(c => `
        <div class="channel-card">
          ${renderAvatar(c, 'lg')}
          <div>
            <div class="stat-brand-name">${escapeHtml(c.name)}</div>
            <div class="stat-sub">${escapeHtml(c.handle || '')}</div>
          </div>
          <span class="pill">${c.active_codes} code${c.active_codes > 1 ? 's' : ''}</span>
          <button class="action-btn" onclick="filterByChannel('${escapeHtml(c.id)}')">Voir ses codes</button>
        </div>
      `).join('');
    }

    function populateSelects() {
      const brandSelect = document.getElementById('brand-filter');
      const channelSelect = document.getElementById('channel-filter');

      [...brandStats].sort((a, b) => a.brand.localeCompare(b.brand, 'fr')).forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.brand.toLowerCase();
        opt.textContent = `${b.brand} (${b.active_codes})`;
        brandSelect.appendChild(opt);
      });

      [...channelStats].sort((a, b) => a.name.localeCompare(b.name, 'fr')).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.active_codes})`;
        channelSelect.appendChild(opt);
      });
    }

    async function init() {
      try {
        const res = await fetch(`./data/promos.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Ne garde strictement que les offres avec un vrai code promo
        validOffers = (data.offers || []).filter(o => o.promo_code && String(o.promo_code).trim() !== '');

        // Recalcule les stats uniquement sur les offres avec code
        const bMap = {};
        const cMap = {};
        for (const o of validOffers) {
          const bKey = (o.brand || '').toLowerCase();
          if (!bMap[bKey]) bMap[bKey] = { brand: o.brand, active_codes: 0 };
          bMap[bKey].active_codes += 1;

          const cKey = o.channel?.id || 'unknown';
          if (!cMap[cKey]) {
            cMap[cKey] = {
              id: cKey,
              name: o.channel?.name || 'Chaîne inconnue',
              handle: o.channel?.handle || '',
              avatar: o.channel?.avatar || null,
              active_codes: 0
            };
          }
          cMap[cKey].active_codes += 1;
        }

        brandStats = Object.values(bMap).sort((a, b) => b.active_codes - a.active_codes);
        channelStats = Object.values(cMap).sort((a, b) => b.active_codes - a.active_codes);

        const updated = data.updated_at ? new Date(data.updated_at).toLocaleString('fr-FR') : '-';
        document.getElementById('updated-at').textContent = `Mis à jour : ${updated}`;
        document.getElementById('retention-badge').textContent = `Rétention : ${data.retention_days || 30} jours`;
        document.getElementById('kpi-offers').textContent = validOffers.length;
        document.getElementById('kpi-brands').textContent = brandStats.length;
        document.getElementById('kpi-channels').textContent = channelStats.length;

        populateSelects();
        renderOffers();
        renderBrandsStats();
        renderChannelsStats();
      } catch (err) {
        document.getElementById('offers-tbody').innerHTML = `
          <tr><td colspan="5" class="empty-state">Impossible de charger <code>data/promos.json</code> (${escapeHtml(err.message)}).</td></tr>`;
      }
    }

    ['search-input', 'brand-filter', 'channel-filter', 'sort-filter'].forEach(id => {
      document.getElementById(id).addEventListener('input', renderOffers);
    });

    document.getElementById('reset-filters').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('brand-filter').value = '';
      document.getElementById('channel-filter').value = '';
      document.getElementById('sort-filter').value = 'brand';
      renderOffers();
    });

    init();
  </script>
</body>
</html>
